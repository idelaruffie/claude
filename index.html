<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mes listes d'achats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f6f6; --card: #ffffff; --ink: #1f1f1f; --muted: #8e8e8e;
    --line: #ececec; --cream: #fbe3a8; --cream-2: #fdf1d3;
    --orange: #f28c28; --red: #e5484d; --ok: #3f9b5b; --ok-soft: #e6f4ea;
    --warn: #c76a00; --warn-soft: #fff1e0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 "Mulish", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }
  header {
    background: var(--cream); padding: calc(18px + env(safe-area-inset-top)) 20px 18px;
    border-radius: 0 0 22px 22px;
  }
  .hello { font-family: "Playfair Display", Georgia, serif; font-size: 24px; font-weight: 700; margin: 0; }
  .sub { color: #7a6a45; font-size: 13px; margin-top: 2px; }
  .search {
    margin-top: 14px; display: flex; align-items: center; gap: 8px;
    background: #fff; border-radius: 12px; padding: 0 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.04);
  }
  .search input { flex: 1; border: 0; outline: 0; padding: 12px 0; font: inherit; font-size: 14px; background: none; }
  .search svg { flex: none; color: var(--ink); }
  .promo {
    text-align: center; color: var(--red); font-size: 11px; font-weight: 800;
    letter-spacing: .06em; text-transform: uppercase; margin: 12px 0 0; min-height: 14px;
  }
  .filters {
    display: flex; gap: 22px; padding: 14px 20px 0; overflow-x: auto;
    font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  }
  .filters button {
    flex: none; background: none; border: 0; padding: 0 0 8px; color: var(--muted);
    font: inherit; letter-spacing: inherit; border-bottom: 2px solid transparent;
  }
  .filters button.on { color: var(--ink); border-color: var(--orange); }
  .section-title {
    font-family: "Playfair Display", Georgia, serif; font-size: 20px; font-weight: 700;
    padding: 16px 20px 0; margin: 0;
  }
  main { padding: 4px 16px; }
  .card {
    background: var(--card); border-radius: 16px; padding: 14px;
    margin: 12px 0; display: flex; gap: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.05);
  }
  .card.done { opacity: .55; }
  .card.done .title { text-decoration: line-through; }
  .check {
    flex: none; width: 26px; height: 26px; border-radius: 8px;
    border: 2px solid #d9d9d9; background: #fff; padding: 0; margin-top: 1px;
    display: grid; place-items: center; color: #fff; font-size: 15px; font-weight: 800;
  }
  .card.done .check { background: var(--orange); border-color: var(--orange); }
  .body { flex: 1; min-width: 0; }
  .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .title { font-weight: 700; font-size: 15px; }
  .price { font-weight: 800; font-size: 16px; white-space: nowrap; }
  .target { color: var(--muted); font-size: 12px; font-weight: 600; text-align: right; }
  .details { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: #f1f1f1; }
  .tag.watch { background: var(--cream-2); color: #8a6a10; }
  .tag.synth { background: var(--warn-soft); color: var(--warn); }
  .tag.nat { background: var(--ok-soft); color: var(--ok); }
  .note { font-size: 13px; margin-top: 8px; padding: 8px 10px; background: #fafafa; border-radius: 10px; color: #555; }
  .row { display: flex; gap: 16px; margin-top: 9px; font-size: 13px; }
  .row a, .row button { color: var(--orange); background: none; border: 0; padding: 0; font: inherit; font-weight: 700; text-decoration: none; }
  .empty { text-align: center; color: var(--muted); padding: 48px 0; }
  .fab {
    position: fixed; right: 20px; bottom: calc(86px + env(safe-area-inset-bottom));
    width: 56px; height: 56px; border-radius: 50%; border: 0;
    background: var(--orange); color: #fff; font-size: 30px; line-height: 1;
    box-shadow: 0 8px 20px rgba(242,140,40,.45); z-index: 6;
  }
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    background: #fff; border-radius: 22px 22px 0 0;
    box-shadow: 0 -4px 18px rgba(0,0,0,.06);
    display: flex; justify-content: space-around;
    padding: 10px 6px calc(10px + env(safe-area-inset-bottom));
  }
  .tabbar button {
    background: none; border: 0; padding: 4px 6px; color: #9a9a9a;
    display: grid; justify-items: center; gap: 3px; font: inherit; font-size: 10.5px; font-weight: 700;
    position: relative; min-width: 56px;
  }
  .tabbar button.on { color: var(--orange); }
  .tabbar .badge {
    position: absolute; top: -2px; right: 8px; background: var(--red); color: #fff;
    font-size: 10px; min-width: 16px; height: 16px; border-radius: 8px; display: grid; place-items: center; padding: 0 4px;
  }
  .menu { padding: 14px 20px; display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; }
  .menu button, .menu label { color: var(--muted); background: none; border: 0; padding: 0; text-decoration: underline; font: inherit; }
  dialog {
    border: 0; border-radius: 22px; padding: 0; width: min(520px, 94vw);
    background: var(--card); color: var(--ink); overflow: hidden;
  }
  dialog::backdrop { background: rgba(20,20,20,.4); }
  .dlg-head { background: var(--cream); padding: 16px 18px; }
  .dlg-head h2 { margin: 0; font-family: "Playfair Display", Georgia, serif; font-size: 20px; }
  form { display: grid; gap: 12px; }
  .fields { padding: 4px 18px 18px; display: grid; gap: 12px; }
  form label { display: grid; gap: 5px; font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  form input, form select, form textarea {
    font: inherit; font-size: 15px; color: var(--ink); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px; background: #fff; text-transform: none; letter-spacing: 0; font-weight: 400;
  }
  form textarea { min-height: 64px; resize: vertical; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chk { display: flex !important; align-items: center; gap: 8px; color: var(--ink) !important; font-size: 14px !important; text-transform: none !important; letter-spacing: 0 !important; font-weight: 600 !important; }
  .chk input { width: 18px; height: 18px; accent-color: var(--orange); }
  .actions { display: flex; gap: 10px; justify-content: space-between; align-items: center; margin-top: 4px; }
  .actions button { border: 0; border-radius: 999px; padding: 12px 20px; font: inherit; font-weight: 800; font-size: 14px; }
  .primary { background: var(--cream); color: var(--ink); }
  .ghost { background: #fff; color: var(--ink); border: 1.5px solid var(--ink) !important; }
  .danger { background: none; color: var(--red); padding-left: 0 !important; }
  .toast {
    position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px;
    font-size: 13px; font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <p class="hello">Bonjour Ines,</p>
  <div class="sub" id="summary"></div>
  <div class="search">
    <input id="search" type="search" placeholder="Rechercher un article…">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  </div>
  <div class="promo" id="promo"></div>
</header>

<div class="filters" id="filters"></div>
<h2 class="section-title" id="sectionTitle"></h2>

<main id="list"></main>

<div class="menu">
  <button id="exportBtn">Exporter (JSON)</button>
  <label>Importer<input type="file" id="importFile" accept="application/json" hidden></label>
  <button id="copyBtn">Copier la liste pour Claude</button>
</div>

<button class="fab" id="addBtn" aria-label="Ajouter">+</button>
<nav class="tabbar" id="tabs"></nav>

<dialog id="dlg">
  <form id="form" method="dialog">
    <div class="dlg-head"><h2 id="formTitle">Nouvel article</h2></div>
    <div class="fields">
    <label>Article
      <input name="title" required placeholder="ex. Housse de couette flanelle">
    </label>
    <label>Détails (taille, couleur…)
      <input name="details" placeholder="ex. 150x200, terracotta">
    </label>
    <div class="two">
      <label>Liste
        <select name="list"></select>
      </label>
      <label>Matière
        <select name="material">
          <option value="">—</option>
          <option value="nat">Naturelle (coton, laine, bois, alu…)</option>
          <option value="synth">Synthétique ⚠️</option>
        </select>
      </label>
    </div>
    <label>Lien
      <input name="url" type="url" placeholder="https://…">
    </label>
    <div class="two">
      <label>Prix repéré (€)
        <input name="price" inputmode="decimal" placeholder="ex. 179,99">
      </label>
      <label>Prix cible (€)
        <input name="target" inputmode="decimal" placeholder="ex. 130">
      </label>
    </div>
    <label class="chk"><input type="checkbox" name="watch"> À surveiller (attendre une baisse)</label>
    <label>Notes / meilleure offre
      <textarea name="note" placeholder="ex. Darty 449,99 € jusqu'au 30/11"></textarea>
    </label>
    <div class="actions">
      <button type="button" class="danger" id="delBtn">Supprimer</button>
      <span style="display:flex;gap:8px">
        <button type="button" class="ghost" id="cancelBtn">Annuler</button>
        <button type="submit" class="primary">Enregistrer</button>
      </span>
    </div>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
const ICON = {
  mountain: '<path d="m3 20 6.5-11 4 6.5 2.5-4L21 20z"/>',
  home: '<path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/>',
  gift: '<rect x="4" y="9" width="16" height="11" rx="1.5"/><path d="M3 9h18M12 9v11M12 9c-2-4-6-4-6-1.5S10 9 12 9c2 0 6-.5 6-1.5S14 5 12 9z"/>',
  heart: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  inbox: '<path d="M4 13h4l1.5 3h5L16 13h4M5 5h14l1 8v6H4v-6z"/>'
};
const LISTS = [
  { id: "font-romeu", name: "Font-Romeu", icon: "mountain" },
  { id: "maison", name: "Maison", icon: "home" },
  { id: "noel", name: "Noël", icon: "gift" },
  { id: "moi", name: "Pour moi", icon: "heart" },
  { id: "a-classer", name: "À classer", icon: "inbox" }
];
const FILTERS = [
  { id: "todo", name: "À acheter" },
  { id: "watch", name: "À surveiller" },
  { id: "done", name: "Achetés" }
];
let filter = "todo";
const KEY = "ines-listes-achats-v1";

const SEED = [
  { list: "font-romeu", title: "Housses de couette flanelle (enfants)", details: "150x200 cm (couettes IKEA) + taies pour oreillers Pikolin Nova 70 cm", material: "nat" },
  { list: "font-romeu", title: "Couvertures en laine", details: "Rouge, vert, bleu marine — esprit Noël", material: "nat", note: "La Redoute : ROMU pure laine 74,10 € (-50 %), Toison d'Or dès 77,50 €" },
  { list: "font-romeu", title: "Haut thermique ski 13-14 ans", details: "Mérinos si possible", material: "nat", note: "Decathlon BL 500 Wool 24,99 € (41 % mérinos) — version polyester 11,99 €" },
  { list: "font-romeu", title: "Legging thermique 14 ans", details: "", material: "nat", note: "Decathlon BL 500 Wool 21,99 €" },
  { list: "font-romeu", title: "Legging thermique 4-5 ans", details: "", material: "synth", note: "Mérinos dès 5 ans seulement — BL 500 polyester 11,99 €" },
  { list: "font-romeu", title: "Gants de ski 14 ans", details: "", material: "synth", note: "Decathlon SKI500 LONG 18,99 € jusqu'au 30/11" },
  { list: "font-romeu", title: "Chaussettes bien chaudes", details: "Pas forcément de ski", material: "nat", note: "Decathlon chaussettes ski mérinos 500 — 11,99 €" },
  { list: "font-romeu", title: "Masque de ski adulte + enfant", details: "Écran S3 (soleil)", material: "synth", note: "Wedze G 500 S3 34,99 € (S enfant / L adulte)" },
  { list: "font-romeu", title: "Tours de cou ski", details: "", material: "nat", note: "Decathlon MT500 mérinos 11,99 €" },
  { list: "font-romeu", title: "Applique murale", details: "Tête de cheval ou lin — anthracite / marron" },
  { list: "font-romeu", title: "Patère large", details: "Bois massif", material: "nat" },
  { list: "font-romeu", title: "Tapis géométrique Mango Home", details: "200x300 cm, chocolat", url: "https://shop.mango.com/es/es/p/home/alfombras/algodon/alfombra-estampado-geometrico-200x300cm/37013291/32/00", price: "179,99", watch: true, material: "nat" },
  { list: "maison", title: "Lave-linge Bosch Série 6", details: "9 kg", note: "Darty WGG244Z3FR 449,99 € (à vérifier) — Boulanger WGG244F1FR 599 €" },
  { list: "noel", title: "Vélo pour ma fille", details: "14 pouces (16 si > 105 cm)", note: "Decathlon Discover 500 14\" 127,99 € jusqu'au 23/12" },
  { list: "moi", title: "Haut thermique ski femme", details: "Taille M — mérinos", material: "nat", note: "Decathlon BL TOP 500 woolneck 59,99 € — Icebreaker Oasis 79,90 € (Snowleader)" },
  { list: "a-classer", title: "Cadres", details: "2× 32x25 cm, 1× 21x29,7 cm (A4), 1× 50x35 cm" }
];

const uid = () => Math.random().toString(36).slice(2, 10);
let items = load();
let current = "font-romeu";
let editingId = null;

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return SEED.map(s => ({ id: uid(), done: false, url: "", price: "", target: "", watch: false, note: "", material: "", details: "", ...s }));
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) { toast("Sauvegarde impossible sur ce navigateur"); }
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1800);
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function renderTabs() {
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  LISTS.forEach(l => {
    const n = items.filter(i => i.list === l.id && !i.done).length;
    const b = document.createElement("button");
    b.className = l.id === current ? "on" : "";
    b.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round">${ICON[l.icon]}</svg>${esc(l.name)}` +
      (n ? `<span class="badge">${n}</span>` : "");
    b.onclick = () => { current = l.id; window.scrollTo(0, 0); render(); };
    nav.appendChild(b);
  });
  const f = document.getElementById("filters");
  f.innerHTML = "";
  FILTERS.forEach(x => {
    const b = document.createElement("button");
    b.className = x.id === filter ? "on" : "";
    b.textContent = x.name;
    b.onclick = () => { filter = x.id; render(); };
    f.appendChild(b);
  });
  const todo = items.filter(i => !i.done).length;
  const watch = items.filter(i => i.watch && !i.done).length;
  document.getElementById("summary").textContent =
    `${todo} article${todo > 1 ? "s" : ""} à acheter dans tes listes`;
  document.getElementById("promo").textContent =
    watch ? `👀 ${watch} article${watch > 1 ? "s" : ""} à surveiller` : "";
  document.getElementById("sectionTitle").textContent = LISTS.find(l => l.id === current).name;
}

function renderList() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const main = document.getElementById("list");
  const pass = i => filter === "done" ? i.done : filter === "watch" ? (i.watch && !i.done) : !i.done;
  let rows = items.filter(i => i.list === current && pass(i));
  if (q) rows = items.filter(i => pass(i) && [i.title, i.details, i.note].join(" ").toLowerCase().includes(q));
  document.getElementById("sectionTitle").textContent = q ? "Résultats" : LISTS.find(l => l.id === current).name;
  if (!rows.length) { main.innerHTML = `<div class="empty">Rien ici pour l'instant.</div>`; return; }
  main.innerHTML = "";
  rows.forEach(i => {
    const el = document.createElement("div");
    el.className = "card" + (i.done ? " done" : "");
    const tags = [];
    if (q) tags.push(`<span class="tag">${esc(LISTS.find(l => l.id === i.list)?.name)}</span>`);
    if (i.watch) tags.push(`<span class="tag watch">👀 à surveiller</span>`);
    if (i.material === "synth") tags.push(`<span class="tag synth">⚠️ synthétique</span>`);
    if (i.material === "nat") tags.push(`<span class="tag nat">🌿 naturel</span>`);
    el.innerHTML = `
      <button class="check" aria-label="Acheté">✓</button>
      <div class="body">
        <div class="top">
          <div class="title">${esc(i.title)}</div>
          ${i.price ? `<div><div class="price">${esc(i.price)} €</div>${i.target ? `<div class="target">cible ${esc(i.target)} €</div>` : ""}</div>` : ""}
        </div>
        ${i.details ? `<div class="details">${esc(i.details)}</div>` : ""}
        ${tags.length ? `<div class="tags">${tags.join("")}</div>` : ""}
        ${i.note ? `<div class="note">${esc(i.note)}</div>` : ""}
        <div class="row">
          ${i.url ? `<a href="${esc(i.url)}" target="_blank" rel="noopener">Voir le produit ↗</a>` : ""}
          <button class="edit">Modifier</button>
        </div>
      </div>`;
    el.querySelector(".check").onclick = () => {
      i.done = !i.done; save(); render();
      toast(i.done ? "Acheté ✓" : "Remis dans la liste");
    };
    el.querySelector(".edit").onclick = () => openForm(i);
    main.appendChild(el);
  });
}

function render() { renderTabs(); renderList(); }

const dlg = document.getElementById("dlg");
const form = document.getElementById("form");
form.list.innerHTML = LISTS.map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join("");

function openForm(item) {
  editingId = item ? item.id : null;
  document.getElementById("formTitle").textContent = item ? "Modifier" : "Nouvel article";
  document.getElementById("delBtn").style.visibility = item ? "visible" : "hidden";
  const v = item || { list: current };
  ["title", "details", "url", "price", "target", "note", "material"].forEach(k => form[k].value = v[k] || "");
  form.list.value = v.list || current;
  form.watch.checked = !!v.watch;
  dlg.showModal();
}
form.onsubmit = e => {
  e.preventDefault();
  const data = {
    title: form.title.value.trim(), details: form.details.value.trim(),
    list: form.list.value, url: form.url.value.trim(), price: form.price.value.trim(),
    target: form.target.value.trim(), note: form.note.value.trim(),
    material: form.material.value, watch: form.watch.checked
  };
  if (!data.title) return;
  if (editingId) Object.assign(items.find(i => i.id === editingId), data);
  else items.unshift({ id: uid(), done: false, ...data });
  current = data.list;
  save(); dlg.close(); render(); toast("Enregistré");
};
document.getElementById("cancelBtn").onclick = () => dlg.close();
document.getElementById("delBtn").onclick = () => {
  const btn = document.getElementById("delBtn");
  if (btn.dataset.armed !== "1") { btn.dataset.armed = "1"; btn.textContent = "Confirmer ?"; return; }
  items = items.filter(i => i.id !== editingId);
  btn.dataset.armed = ""; btn.textContent = "Supprimer";
  save(); dlg.close(); render(); toast("Supprimé");
};
dlg.addEventListener("close", () => {
  const btn = document.getElementById("delBtn");
  btn.dataset.armed = ""; btn.textContent = "Supprimer";
});

document.getElementById("addBtn").onclick = () => openForm(null);
document.getElementById("search").oninput = renderList;

document.getElementById("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(items, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "listes-achats.json";
  a.click();
};
document.getElementById("importFile").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => {
    try {
      const data = JSON.parse(t);
      if (!Array.isArray(data)) throw 0;
      items = data; save(); render(); toast("Listes importées");
    } catch (_) { toast("Fichier invalide"); }
  });
};
document.getElementById("copyBtn").onclick = () => {
  const txt = LISTS.map(l => {
    const rows = items.filter(i => i.list === l.id && !i.done);
    if (!rows.length) return "";
    return `## ${l.name}\n` + rows.map(i =>
      `- ${i.title}${i.details ? " — " + i.details : ""}${i.watch ? " (à surveiller)" : ""}${i.url ? " " + i.url : ""}`
    ).join("\n");
  }).filter(Boolean).join("\n\n");
  navigator.clipboard.writeText(txt).then(() => toast("Copié — colle-le à Claude"), () => toast("Copie impossible"));
};

render();
